<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prévisions du besoin face à l'historique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEFF3; --panel:#FFFFFF; --ink:#16212C; --muted:#5B6976; --rule:#D2D9E0; --zero:#7D8996; --pred:#16212C;
  --q1:#B3261E; --q2:#E7907E; --q3:#C3CAD1; --q4:#83C4A0; --q5:#1E7B4F;
  --q1t:#A1221B; --q2t:#B9513D; --q3t:#5B6976; --q4t:#2F8A5A; --q5t:#196842;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161D; --panel:#18212A; --ink:#E4EAF0; --muted:#93A1AE; --rule:#2A3541; --zero:#6B7884; --pred:#F2F5F8;
    --q1:#D2453B; --q2:#9B5A4F; --q3:#3E4954; --q4:#4D8A68; --q5:#36A86E;
    --q1t:#FF7A70; --q2t:#E9A090; --q3t:#AEB9C4; --q4t:#8CD3AA; --q5t:#5FD495;
  }
}
:root[data-theme="dark"]{
  --bg:#10161D; --panel:#18212A; --ink:#E4EAF0; --muted:#93A1AE; --rule:#2A3541; --zero:#6B7884; --pred:#F2F5F8;
  --q1:#D2453B; --q2:#9B5A4F; --q3:#3E4954; --q4:#4D8A68; --q5:#36A86E;
  --q1t:#FF7A70; --q2t:#E9A090; --q3t:#AEB9C4; --q4t:#8CD3AA; --q5t:#5FD495;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:40px 24px 64px}
header h1{font-size:clamp(28px,4.4vw,44px);line-height:1.08;font-weight:700;letter-spacing:-.02em;margin:0 0 12px;max-width:18ch}
header p{margin:0;color:var(--muted);max-width:70ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:20px;font-size:14px}
.meta div{display:flex;flex-direction:column}
.meta span{color:var(--muted);font-size:13px}
.meta strong{font-weight:600;font-size:17px}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:36px 0 10px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px;width:22px;height:10px;border-radius:2px}
.legend .lg-pred{width:4px;height:16px;border-radius:2px;background:var(--pred)}

.ladder{background:var(--panel);border-radius:14px;padding:6px 0}
.row{display:grid;grid-template-columns:132px 1fr 190px;gap:20px;align-items:center;padding:18px 24px;border:0;background:none;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--rule)}
.row[aria-pressed="true"]{border-left-color:var(--ink);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.row:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.h-name{font-weight:600;font-size:19px;line-height:1.2}
.h-end{font-size:13px;color:var(--muted)}
.track{position:relative;height:64px}
.axis{position:absolute;left:0;right:0;top:29px;height:2px;background:var(--rule)}
.zone{position:absolute;top:22px;height:16px}
.t-zero{position:absolute;top:12px;height:36px;width:0;border-left:1px dashed var(--zero)}
.t-pred{position:absolute;top:15px;width:4px;height:30px;margin-left:-2px;border-radius:2px;background:var(--pred);box-shadow:0 0 0 2px var(--panel)}
.t-pred-lab{position:absolute;top:-4px;font-size:13px;font-weight:600;white-space:nowrap;transform:translateX(-50%)}
.t-tick{position:absolute;bottom:-2px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.res{display:flex;justify-content:flex-end}
.tag{display:inline-block;font-weight:600;font-size:15px;padding:6px 12px;border-radius:8px;line-height:1.2;text-align:center}
.c1{color:#fff;background:var(--q1)} .c2{color:var(--q2t);background:color-mix(in srgb,var(--q2) 30%,transparent)}
.c3{color:var(--q3t);background:color-mix(in srgb,var(--q3) 45%,transparent)}
.c4{color:var(--q4t);background:color-mix(in srgb,var(--q4) 30%,transparent)} .c5{color:#fff;background:var(--q5)}
.t1{color:var(--q1t)}.t2{color:var(--q2t)}.t3{color:var(--q3t)}.t4{color:var(--q4t)}.t5{color:var(--q5t)}

.detail{margin-top:40px}
.detail h2{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.detail > p{margin:0 0 20px;color:var(--muted);max-width:72ch}
.grid{display:grid;grid-template-columns:1fr 2fr;gap:20px}
.card{background:var(--panel);border-radius:14px;padding:18px 18px 10px}
.card h3{font-size:15px;font-weight:600;margin:0 0 2px}
.card .sub{font-size:13px;color:var(--muted);margin:0 0 8px}
.chart{width:100%;overflow-x:auto}
svg text{font-family:inherit;font-size:11px;fill:var(--muted)}
svg .lab-pred{fill:var(--ink);font-weight:600;font-size:12px}
.qtable{background:var(--panel);border-radius:14px;margin-top:24px;max-width:520px;overflow-x:auto}
.qtable table{width:100%;border-collapse:collapse;font-size:14px;}
.qtable th,.qtable td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--rule)}
.qtable th{font-weight:500;color:var(--muted);font-size:13px}
.qtable tr:last-child td{border-bottom:0}
.qtable tr.on td{font-weight:600;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:middle}
footer{margin-top:40px;font-size:13px;color:var(--muted);max-width:76ch}

@media (max-width:760px){
  .wrap{padding:28px 16px 48px}
  .row{grid-template-columns:1fr auto;grid-template-areas:"name res" "track track";gap:8px 12px;padding:16px}
  .row .name{grid-area:name}.row .track{grid-area:track}.row .res{grid-area:res}
  .grid{grid-template-columns:1fr}
}

.loader{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:24px;padding:14px 16px;background:var(--panel);border-radius:12px;font-size:14px}
.loader label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.loader label:hover{border-color:var(--ink)}
.loader label:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.loader input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.loader select{font:inherit;font-size:14px;padding:5px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);color:var(--ink)}
.status{color:var(--muted);font-size:13px;flex-basis:100%}
.status.err{color:var(--q1t)}
body.drag .wrap{outline:2px dashed var(--ink);outline-offset:-8px;border-radius:16px}
.nohist{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Prévisions du besoin face à l'historique</h1>
  <div class="meta" id="meta"></div>
  <div class="loader">
    <label><input type="file" id="fPred" accept=".csv,text/csv">Charger et_predictions.csv</label>
    <label><input type="file" id="fLab" accept=".csv,text/csv">Charger labels_valais_weekly.csv</label>
    <span id="weekWrap" hidden>Semaine de départ <select id="weekSel"></select></span>
    <span class="status" id="status"></span>
  </div>
</header>

<div class="legend" id="legend"></div>
<div class="ladder" id="ladder"></div>

<div class="qtable" id="qtable"></div>

</div>

const DEFAULT_PREDS = `run_at,feature_week,horizon,horizon_end_week,target,prediction
2026-10-04T11:25:14,2026-09-21,2w,2026-10-05,y_vs_chg_2w,-0.00023417761567663144
2026-10-04T11:25:14,2026-09-21,4w,2026-10-19,y_vs_chg_4w,-0.019152984927849944

2026-10-04T11:25:15,2026-09-21,13w,2026-12-21,y_vs_chg_13w,-0.09262832719576719`;
const DEFAULT_LEVELS = {"2026-09-21":173.10877, "2026-09-28":173.413};

// Mêmes seuils et même échelle pour toutes les durées
const SEUILS = [-0.05, -0.01, 0.01, 0.05];
const AXE = 0.15; // axe de −15 % à +15 %
const CATS = ["Forte baisse","Baisse","Stable","Hausse","Forte hausse"];

const S = { labels:null, preds:null, week:null, sel:null, src:{pred:"exemple intégré", lab:"exemple intégré"} };

const nf2 = new Intl.NumberFormat("fr-CH",{minimumFractionDigits:2,maximumFractionDigits:2,signDisplay:"exceptZero"});
const nf1 = new Intl.NumberFormat("fr-CH",{minimumFractionDigits:1,maximumFractionDigits:1,signDisplay:"exceptZero"});
const nf0 = new Intl.NumberFormat("fr-CH",{maximumFractionDigits:0,signDisplay:"exceptZero"});
const nfL = new Intl.NumberFormat("fr-CH",{minimumFractionDigits:1,maximumFractionDigits:1});
const pct = v => nf2.format(v*100).replace("-","−")+" %";
const pct1 = v => nf1.format(v*100).replace("-","−")+" %";
const pct0 = v => nf0.format(v*100).replace("-","−")+" %";
const toDate = s => new Date(String(s).slice(0,10)+"T00:00:00");
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fdate = s => (typeof s==="string"?toDate(s):s).toLocaleDateString("fr-CH",{day:"2-digit",month:"2-digit",year:"numeric"});
const fdt = s => { const d=new Date(s); return isNaN(d)? s : d.toLocaleString("fr-CH",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
const cat = v => SEUILS.filter(c=>v>=c).length; // 0..4
const qcol = i => `var(--q${i+1})`;
const X100 = v => (Math.max(-AXE,Math.min(AXE,v))+AXE)/(2*AXE)*100;

function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim()!=="");
  const sep = (lines[0].match(/;/g)||[]).length > (lines[0].match(/,/g)||[]).length ? ";" : ",";
  const head=lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,""));
  return {head, rows:lines.slice(1).map(l=>{const c=l.split(sep);const o={};head.forEach((h,i)=>o[h]=(c[i]??"").trim().replace(/^"|"$/g,""));return o;})};
}
const num = s => (s===""||s==null||isNaN(+s)) ? null : +s;

function loadLabels(text, levels){
  const {head,rows}=parseCSV(text);
  if(!head.includes("date")) throw new Error("le fichier labels n'a pas de colonne « date »");
  const tcols=head.filter(h=>/^y_vs_chg_\d+w$/.test(h));
  if(!tcols.length) throw new Error("aucune colonne y_vs_chg_*w trouvée dans le fichier labels");
  const out=rows.map(r=>{const o={date:toDate(r.date), level:num(r.jt_vs), v:{}}; tcols.forEach(c=>o.v[c]=num(r[c])); return o;})
    .filter(r=>!isNaN(r.date)).sort((a,b)=>a.date-b.date);
  return {rows:out, tcols, levels:levels||{}};
}
function loadPreds(text){
  const {head,rows}=parseCSV(text);
  ["feature_week","horizon","target","prediction"].forEach(c=>{ if(!head.includes(c)) throw new Error(`colonne « ${c} » absente de et_predictions.csv`); });
  const out=rows.map(r=>({run_at:r.run_at||"", week:String(r.feature_week).slice(0,10), horizon:r.horizon, weeks:parseInt(r.horizon),
      end:r.horizon_end_week?String(r.horizon_end_week).slice(0,10):null, target:r.target, v:num(r.prediction)}))
    .filter(r=>r.v!==null && !isNaN(r.weeks));
  if(!out.length) throw new Error("aucune prédiction lisible dans et_predictions.csv");
  return out;
}

function currentPreds(){
  const byH={};
  S.preds.filter(p=>p.week===S.week).forEach(p=>{ if(!byH[p.horizon] || p.run_at>byH[p.horizon].run_at) byH[p.horizon]=p; });
  return Object.values(byH).sort((a,b)=>a.weeks-b.weeks).map(p=>{
    const end = p.end || iso(new Date(toDate(p.week).getTime()+p.weeks*7*864e5));
    const pts = S.labels.tcols.includes(p.target) ? S.labels.rows.filter(r=>r.v[p.target]!==null && r.date<toDate(p.week)) : [];
    const s = pts.map(r=>r.v[p.target]).sort((a,b)=>a-b);
    return {...p, end, name:`${p.weeks} semaine${p.weeks>1?"s":""}`, pc:cat(p.v),
      st: s.length ? {pts,s,n:s.length,min:s[0],max:s[s.length-1]} : null};
  });
}
function levelAt(week){
  if(S.labels.levels[week]!=null) return S.labels.levels[week];
  const d=toDate(week); let best=null;
  S.labels.rows.forEach(r=>{ if(r.level!=null && r.date<=d) best=r; });
  return best && (d-best.date)<=28*864e5 ? best.level : null;
}

function niceTicks(a,b,n){
  const raw=(b-a)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), r=raw/mag;
  const step=(r<1.5?1:r<3?2:r<7?5:10)*mag; const t=[];
  for(let x=Math.ceil(a/step)*step; x<=b+1e-12; x+=step) t.push(+x.toFixed(10));
  return t;
}

function setStatus(msg, err){ const el=document.getElementById("status"); el.textContent=msg; el.className="status"+(err?" err":""); }

function renderHeader(P){
  const lvl=levelAt(S.week); const runs=P.map(p=>p.run_at).filter(Boolean).sort();
  document.getElementById("meta").innerHTML =
    `<div><span>Semaine de départ</span><strong>${fdate(S.week)}</strong></div>
     ${runs.length?`<div><span>Exécution du modèle</span><strong>${fdt(runs[runs.length-1])}</strong></div>`:""}
     <div><span>Horizons prévus</span><strong>${P.length}</strong></div>`;
  document.getElementById("legend").innerHTML =
    CATS.map((c,i)=>`<span><i style="background:${qcol(i)}"></i>${c}</span>`).join("") +
    `<span><i class="lg-pred"></i>Prévision</span>`;
  const weeks=[...new Set(S.preds.map(p=>p.week))].sort().reverse();
  document.getElementById("weekWrap").hidden = weeks.length<2;
  document.getElementById("weekSel").innerHTML = weeks.map(w=>`<option value="${w}" ${w===S.week?"selected":""}>${fdate(w)}</option>`).join("");
}

function renderLadder(P){
  const el=document.getElementById("ladder"); el.innerHTML="";
  const edges=[-AXE,...SEUILS,AXE];
  const ticks=niceTicks(-AXE,AXE,6);
  P.forEach(p=>{
    const st=p.st;
    const b=document.createElement("div");
    b.className="row";
    const labX=Math.min(Math.max(X100(p.v),6),94);
    b.innerHTML=`
      <div class="name"><div class="h-name">${p.name}</div><div class="h-end">d'ici ${fdate(p.end)}</div></div>
      <div class="track">
        ${[0,1,2,3,4].map(i=>`<span class="zone" style="left:${X100(edges[i])}%;width:${X100(edges[i+1])-X100(edges[i])}%;background:${qcol(i)};opacity:.85;${i===0?"border-radius:4px 0 0 4px;":""}${i===4?"border-radius:0 4px 4px 0;":""}"></span>`).join("")}
        <span class="t-pred" style="left:${X100(p.v)}%"></span>
        <span class="t-pred-lab t${p.pc+1}" style="left:${labX}%">${pct(p.v)}</span>
        ${ticks.map(t=>`<span class="t-tick" style="left:${X100(t)}%">${pct0(t)}</span>`).join("")}
      </div>
      <div class="res"><span class="tag c${p.pc+1}">${CATS[p.pc]}</span></div>`;
    el.appendChild(b);
  });
}

function renderTable(){
  const e=[null,...SEUILS,null];
  const range=i=> i===0?`moins de ${pct0(SEUILS[0])}`: i===4?`plus de ${pct0(SEUILS[3])}`:`de ${pct0(e[i])} à ${pct0(e[i+1])}`;
  document.getElementById("qtable").innerHTML = `<table>
    <thead><tr><th>Catégorie</th><th>Variation</th></tr></thead><tbody>
    ${CATS.map((c,i)=>`<tr><td class="t${i+1}"><span class="sw" style="background:${qcol(i)}"></span>${c}</td><td>${range(i)}</td></tr>`).reverse().join("")}
    </tbody></table>`;
}

function renderAll(){
  const P=currentPreds();
  renderHeader(P); renderLadder(P); renderTable();
  setStatus(`Prévisions : ${S.src.pred} · Historique : ${S.src.lab}`);
}

function readFile(file, kind){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      if(kind==="pred"){ S.preds=loadPreds(fr.result); S.src.pred=file.name; S.week=[...new Set(S.preds.map(p=>p.week))].sort().pop(); }
      else { S.labels=loadLabels(fr.result); S.src.lab=file.name; }
      renderAll();
    }catch(e){ setStatus(`${file.name} : ${e.message}.`, true); }
  };
  fr.readAsText(file);
}
function guessKind(file, text){ return /prediction/i.test(file.name) ? "pred" : "lab"; }

document.getElementById("fPred").addEventListener("change",e=>{ if(e.target.files[0]) readFile(e.target.files[0],"pred"); e.target.value=""; });
document.getElementById("fLab").addEventListener("change",e=>{ if(e.target.files[0]) readFile(e.target.files[0],"lab"); e.target.value=""; });
document.getElementById("weekSel").addEventListener("change",e=>{ S.week=e.target.value; renderAll(); });
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();document.body.classList.add("drag");}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();if(ev==="drop"||e.target===document.documentElement)document.body.classList.remove("drag");}));
document.addEventListener("drop",e=>{ [...(e.dataTransfer?.files||[])].forEach(f=>readFile(f, guessKind(f))); });

S.labels=loadLabels(DEFAULT_LABELS, DEFAULT_LEVELS);
S.preds=loadPreds(DEFAULT_PREDS);
S.week=[...new Set(S.preds.map(p=>p.week))].sort().pop();
renderAll();
</script>
